project:
  type: book
  output-dir: _site

lang: it

book:
  title: "R × IT"
  subtitle: "Capire, valutare e gestire soluzioni sviluppate in R"
  search: true
  reader-mode: true

  repo-url: https://github.com/andreabz/R_per_IT
  repo-branch: main
  description: "Manuale tecnico per IT: capire, valutare e gestire soluzioni sviluppate in R"
  repo-actions: [edit, source, issue]

  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  navbar:
    background: light
    left:
      - text: "Manuale"
        href: index.qmd
      - text: "Repository"
        href: https://github.com/andreabz/R_per_IT

  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - text: "Introduzione"
        href: index.qmd

      - section: "1. Contesto e ambiente R"
        contents:
          - 01-contesto.qmd

      - section: "2. Runtime, memoria e parallelismo"
        contents:
          - 02-runtime.qmd

      - section: "3. Performance e diagnostica"
        contents:
          - 03-performance.qmd

      - section: "4. Architettura e integrazione"
        contents:
          - 04-architettura.qmd

      - section: "5. Deployment e gestione operativa"
        contents:
          - 05-deployment.qmd

      - section: "6. Decisioni operative"
        contents:
          - 06-decisioni.qmd

  chapters:
    - index.qmd
    - 01-contesto.qmd
    - 02-runtime.qmd
    - 03-performance.qmd
    - 04-architettura.qmd
    - 05-deployment.qmd
    - 06-governance.qmd
    - 07-caso-finale.qmd

format:
  html:
    theme: default
    toc: true
    toc-depth: 3
    toc-location: left
    toc-expand: 2
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    css: styles.css

execute:
  echo: true
  warning: false
  message: false
  enabled: false
