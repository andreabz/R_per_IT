project:
  type: book
  output-dir: _site
  render:
    - index.qmd
    - 01-contesto.qmd
    - 02-runtime.qmd
    - 03-performance.qmd
    - 04-architettura.qmd
    - 05-deployment.qmd
    - 06-governance.qmd
    - 07-caso-finale.qmd

book:
  title: "R per l'IT"
  subtitle: "Capire, valutare e governare soluzioni sviluppate in R"
  search: true
  reader-mode: true
  repo-url: https://github.com/andreabz/R_per_IT
  repo-actions: [edit, source, issue]
  chapters:
    - index.qmd
    - 01-contesto.qmd
    - 02-runtime.qmd
    - 03-performance.qmd
    - 04-architettura.qmd
    - 05-deployment.qmd
    - 06-governance.qmd
    - 07-caso-finale.qmd

format:
  html:
    theme: default
    toc: true
    toc-depth: 3
    toc-location: left
    toc-expand: 2
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    css: styles.css

execute:
  echo: true
  warning: false
  message: false
  enabled: false
