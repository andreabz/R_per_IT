project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - 01-contesto.qmd
    - 02-runtime.qmd
    - 03-performance.qmd
    - 04-architettura.qmd
    - 05-deployment.qmd
    - 06-governance.qmd
    - 07-caso-finale.qmd

website:
  title: "R per l'IT"
  description: "Capire, valutare e governare soluzioni sviluppate in R"
  search: true
  navbar:
    background: light
    left:
      - text: "Corso"
        href: index.qmd
      - text: "Repository"
        href: https://github.com/andreabz/R_per_IT
  sidebar:
    style: "docked"
    collapse-level: 1
    contents:
      - text: "Home"
        href: index.qmd
      - section: "1. Contesto e ambiente R"
        contents:
          - 01-contesto.qmd
      - section: "2. Runtime, processi e parallelismo"
        contents:
          - 02-runtime.qmd
      - section: "3. Performance e diagnostica"
        contents:
          - 03-performance.qmd
      - section: "4. Architettura e integrazione"
        contents:
          - 04-architettura.qmd
      - section: "5. Deployment e gestione operativa"
        contents:
          - 05-deployment.qmd
      - section: "6. Governance e valutazione delle richieste"
        contents:
          - 06-governance.qmd
      - section: "7. Caso finale e checklist"
        contents:
          - 07-caso-finale.qmd

format:
  html:
    theme: default
    toc: true
    toc-location: left
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    css: styles.css

execute:
  echo: true
  warning: false
  message: false
  enabled: false
